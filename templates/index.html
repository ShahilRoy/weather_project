<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SkyCast - Weather Intelligence</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "secondary-fixed-dim": "#adc6ff","on-tertiary": "#620040","surface": "#0b1326",
          "tertiary-container": "#e364a7","on-surface": "#dae2fd","on-secondary-fixed": "#001a42",
          "primary-fixed": "#f0dbff","surface-container-lowest": "#060e20","secondary": "#adc6ff",
          "inverse-on-surface": "#283044","primary-fixed-dim": "#ddb7ff","tertiary-fixed": "#ffd8e7",
          "on-secondary": "#002e6a","on-primary-fixed-variant": "#6900b3","inverse-surface": "#dae2fd",
          "on-error": "#690005","surface-dim": "#0b1326","outline": "#988d9f",
          "surface-container-low": "#131b2e","background": "#0b1326","outline-variant": "#4d4354",
          "primary-container": "#b76dff","inverse-primary": "#842bd2","surface-variant": "#2d3449",
          "surface-container": "#171f33","surface-bright": "#31394d","on-secondary-container": "#e6ecff",
          "secondary-container": "#0566d9","surface-container-high": "#222a3d","tertiary-fixed-dim": "#ffafd3",
          "surface-tint": "#ddb7ff","tertiary": "#ffafd3","secondary-fixed": "#d8e2ff",
          "on-primary-container": "#400071","on-error-container": "#ffdad6","on-tertiary-fixed-variant": "#85145a",
          "error": "#ffb4ab","primary": "#ddb7ff","on-tertiary-fixed": "#3d0026",
          "on-tertiary-container": "#560038","error-container": "#93000a","on-primary-fixed": "#2c0051",
          "surface-container-highest": "#2d3449","on-secondary-fixed-variant": "#004395",
          "on-background": "#dae2fd","on-surface-variant": "#cfc2d6","on-primary": "#490080"
        }
      },
    },
  }
</script>
<style>
  :root { --bg-gradient: radial-gradient(circle at 50% 0%, #1a1033 0%, #0b1326 100%); }
  body { background: var(--bg-gradient); min-height: 100vh; color: #dae2fd; transition: background 1s ease; }
  .glass-panel { background: rgba(255,255,255,0.03); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1); }
  .glass-card-hover:hover { border-color: rgba(183,109,255,0.4); box-shadow: 0 0 20px rgba(183,109,255,0.1); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(183,109,255,0.2); border-radius: 10px; }
  #map { height: 300px; border-radius: 2rem; z-index: 10; border: 1px solid rgba(255,255,255,0.1); }
  .loading-pulse { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .weather-rain { background: radial-gradient(circle at 50% 0%, #101a33 0%, #0b1326 100%) !important; }
  .weather-clear { background: radial-gradient(circle at 50% 0%, #332610 0%, #0b1326 100%) !important; }
  .weather-storm { background: radial-gradient(circle at 50% 0%, #201033 0%, #050510 100%) !important; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>
<body class="font-body-md selection:bg-primary/30 overflow-x-hidden">

<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-slate-950/40 backdrop-blur-[20px] border-b border-white/10">
  <div class="flex items-center gap-4">
    <span class="font-['Space_Grotesk'] text-2xl font-bold tracking-tighter text-white uppercase">SkyCast</span>
  </div>
  <div class="flex-1 max-w-xl px-8 hidden md:block">
    <div class="relative">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span>
      <input id="citySearchInput" class="w-full bg-white/5 border border-white/10 rounded-full py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-purple-500/50 outline-none transition-all" placeholder="Search city..."/>
    </div>
  </div>
  <div class="flex items-center gap-4">
    <div id="loadingIndicator" class="hidden loading-pulse text-primary"><span class="material-symbols-outlined">sync</span></div>
    <button class="material-symbols-outlined text-slate-400 p-2">notifications</button>
  </div>
</header>

<main class="pt-24 pb-32 px-6 max-w-7xl mx-auto space-y-12">
  
  <!-- Recent Searches (Personalization) -->
  <section id="recentSection" class="hidden">
    <h3 class="font-label-caps text-xs text-slate-500 mb-4 tracking-widest uppercase">Quick Access</h3>
    <div id="recentContainer" class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
      <!-- Recent cities chips -->
    </div>
  </section>

  <!-- Hero & Insights -->
  <section class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <div id="mainWeatherCard" class="lg:col-span-8 glass-panel rounded-[2rem] p-8 relative overflow-hidden flex flex-col justify-between min-h-[440px]">
      <div class="absolute -top-24 -right-24 w-96 h-96 bg-primary/10 rounded-full blur-[100px]"></div>
      <div class="relative z-10 flex justify-between items-start">
        <div>
          <h1 id="cityName" class="text-5xl font-bold text-on-surface mb-2">Search City</h1>
          <p id="currentDateTime" class="text-slate-400 flex items-center gap-2">—</p>
        </div>
        <div class="text-right">
          <span id="weatherIcon" class="material-symbols-outlined text-7xl text-primary" style="font-variation-settings:'FILL' 1">cloud</span>
          <p id="weatherCondition" class="text-2xl font-medium text-on-surface mt-2">—</p>
        </div>
      </div>
      <div class="relative z-10 flex flex-col md:flex-row items-end justify-between gap-8">
        <div class="flex items-baseline">
          <span id="currentTemp" class="text-9xl font-bold text-white tracking-tighter">—</span>
          <span class="text-4xl text-slate-400 ml-2">°C</span>
        </div>
        <div class="grid grid-cols-3 gap-4 w-full md:w-auto">
          <div class="glass-panel p-4 rounded-2xl text-center"><span class="text-xs text-slate-400 block uppercase mb-1">Humidity</span><span id="humidity" class="font-bold text-white">—</span></div>
          <div class="glass-panel p-4 rounded-2xl text-center"><span class="text-xs text-slate-400 block uppercase mb-1">Wind</span><span id="windSpeed" class="font-bold text-white">—</span></div>
          <div class="glass-panel p-4 rounded-2xl text-center"><span class="text-xs text-slate-400 block uppercase mb-1">UV</span><span id="uvIndex" class="font-bold text-white">—</span></div>
        </div>
      </div>
    </div>

    <!-- Map & Details -->
    <div class="lg:col-span-4 flex flex-col gap-6">
      <div id="map" class="glass-panel"></div>
      <div class="glass-panel rounded-[2rem] p-6 flex-1">
        <h3 class="text-xs text-slate-500 uppercase tracking-widest mb-4">Feels Like</h3>
        <div class="text-4xl font-bold text-white mb-2"><span id="feelsLike">—</span>°C</div>
        <p id="feelsLikeDesc" class="text-sm text-slate-400 leading-relaxed">—</p>
      </div>
    </div>
  </section>

  <!-- Hourly Forecast (New) -->
  <section>
    <h3 class="text-xs text-slate-500 uppercase tracking-widest mb-4">Hourly Timeline (Next 24h)</h3>
    <div id="hourlyContainer" class="flex gap-4 overflow-x-auto no-scrollbar pb-2">
      <!-- Hourly items -->
    </div>
  </section>

  <!-- Trends (Data Visualization) -->
  <section class="glass-panel rounded-[2rem] p-8">
    <h2 class="text-2xl font-bold mb-8">Weekly Temperature Trend</h2>
    <div class="h-[300px] w-full">
      <canvas id="trendChart"></canvas>
    </div>
  </section>

  <!-- 7-Day Forecast -->
  <section>
    <h2 class="text-2xl font-bold mb-6">Extended Forecast</h2>
    <div id="forecastContainer" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-4">
      <!-- Forecast cards -->
    </div>
  </section>
</main>

<script>
  let map, trendChart;

  // ── Helpers ────────────────────────────────────────────
  function getWeatherIcon(condition = '') {
    const c = condition.toLowerCase();
    if (c.includes('thunder') || c.includes('storm')) return 'thunderstorm';
    if (c.includes('snow') || c.includes('blizzard') || c.includes('sleet')) return 'weather_snowy';
    if (c.includes('rain') || c.includes('drizzle') || c.includes('shower')) return 'rainy';
    if (c.includes('fog') || c.includes('mist') || c.includes('haze')) return 'foggy';
    if (c.includes('overcast')) return 'cloud';
    if (c.includes('partly') || c.includes('partial')) return 'partly_cloudy_day';
    if (c.includes('cloud')) return 'cloudy';
    if (c.includes('clear') || c.includes('sunny')) return 'wb_sunny';
    return 'partly_cloudy_day';
  }

  // 1. Initialization
  function initMap(lat = 0, lon = 0) {
    if (map) map.remove();
    map = L.map('map', { zoomControl: false }).setView([lat, lon], 10);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
  }
  initMap();

  function initChart(labels, temps) {
    const ctx = document.getElementById('trendChart').getContext('2d');
    if (trendChart) trendChart.destroy();
    
    const gradient = ctx.createLinearGradient(0, 0, 0, 400);
    gradient.addColorStop(0, 'rgba(183, 109, 255, 0.4)');
    gradient.addColorStop(1, 'rgba(183, 109, 255, 0)');

    trendChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Temperature (°C)',
          data: temps,
          borderColor: '#b76dff',
          borderWidth: 3,
          tension: 0.4,
          fill: true,
          backgroundColor: gradient,
          pointBackgroundColor: '#fff',
          pointRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } },
          x: { grid: { display: false }, ticks: { color: '#64748b' } }
        }
      }
    });
  }

  // 2. Personalization (LocalStorage)
  function saveRecent(city) {
    let recent = JSON.parse(localStorage.getItem('recent_cities') || '[]');
    recent = [city, ...recent.filter(c => c !== city)].slice(0, 5);
    localStorage.setItem('recent_cities', JSON.stringify(recent));
    renderRecent();
  }

  function renderRecent() {
    const container = document.getElementById('recentContainer');
    const recent = JSON.parse(localStorage.getItem('recent_cities') || '[]');
    if (recent.length === 0) return;
    document.getElementById('recentSection').classList.remove('hidden');
    container.innerHTML = recent.map(city => `
      <button onclick="fetchWeather('${city}')" class="px-4 py-2 glass-panel rounded-full text-sm whitespace-nowrap hover:bg-white/10 transition-all border-white/5">
        ${city}
      </button>
    `).join('');
  }
  renderRecent();

  // 3. Dynamic Themes
  function updateTheme(condition) {
    const body = document.body;
    body.classList.remove('weather-rain', 'weather-clear', 'weather-storm');
    const c = condition.toLowerCase();
    if (c.includes('rain')) body.classList.add('weather-rain');
    else if (c.includes('clear') || c.includes('sunny')) body.classList.add('weather-clear');
    else if (c.includes('storm') || c.includes('thunder')) body.classList.add('weather-storm');
  }

  // 4. API & Data Mapping
  async function fetchWeather(city) {
    if (!city) return;
    document.getElementById('loadingIndicator').classList.remove('hidden');
    try {
      const response = await fetch(`/weather/${encodeURIComponent(city)}/`);
      const data = await response.json();
      
      // Update Hero
      document.getElementById('cityName').textContent = data.resolvedAddress;
      document.getElementById('currentTemp').textContent = Math.round(data.currentConditions.temp);
      document.getElementById('weatherCondition').textContent = data.currentConditions.conditions;
      document.getElementById('humidity').textContent = data.currentConditions.humidity + '%';
      document.getElementById('windSpeed').textContent = data.currentConditions.windspeed + ' km/h';
      document.getElementById('feelsLike').textContent = Math.round(data.currentConditions.feelslike);
      
      updateTheme(data.currentConditions.conditions);
      saveRecent(data.resolvedAddress);
      initMap(data.latitude, data.longitude);
      
      // Helper: safely parse "YYYY-MM-DD" without timezone shift
      function parseDayName(dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        return new Date(y, m - 1, d).toLocaleDateString('en-US', {weekday: 'short'});
      }

      // Update Chart & Forecast
      const forecastLabels = data.days.slice(0, 7).map(d => parseDayName(d.datetime));
      const forecastTemps = data.days.slice(0, 7).map(d => d.temp);
      initChart(forecastLabels, forecastTemps);

      // Update Hourly (Next 24 Hours)
      const hourlyContainer = document.getElementById('hourlyContainer');
      // Defensive check: only use days that have hourly data
      const daysWithHours = data.days.filter(d => d.hours && d.hours.length > 0);
      if (daysWithHours.length === 0) {
        hourlyContainer.innerHTML = '<p class="text-slate-500 text-sm">Hourly data unavailable. Try searching again.</p>';
      } else {
        const allHours = daysWithHours.flatMap(d => d.hours);
        const currentHour = new Date().getHours();
        // Find the first hour in today's data that matches or exceeds the current hour
        const todayHours = daysWithHours[0].hours;
        let startIndex = todayHours.findIndex(h => parseInt(h.datetime.split(':')[0]) >= currentHour);
        if (startIndex === -1) startIndex = 0;
        // Offset into allHours: skip today's past hours
        const globalStart = daysWithHours[0].hours.indexOf(todayHours[startIndex]);

        hourlyContainer.innerHTML = allHours.slice(globalStart, globalStart + 24).map(hour => `
          <div class="glass-panel px-6 py-4 rounded-2xl text-center min-w-[120px] border-white/5 flex flex-col items-center gap-2">
            <div class="text-[10px] text-slate-500 uppercase font-bold">${hour.datetime.slice(0,5)}</div>
            <span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings:'FILL' 1">${getWeatherIcon(hour.conditions)}</span>
            <div class="font-bold text-white">${Math.round(hour.temp)}°</div>
            <div class="text-[10px] text-slate-500 truncate w-full">${hour.conditions}</div>
          </div>
        `).join('');
      }

      const forecastContainer = document.getElementById('forecastContainer');
      forecastContainer.innerHTML = data.days.slice(1, 8).map(day => `
        <div class="glass-panel p-6 rounded-3xl text-center glass-card-hover transition-all">
          <div class="text-slate-500 text-xs font-bold uppercase mb-3">${parseDayName(day.datetime)}</div>
          <span class="material-symbols-outlined text-primary text-3xl mb-2" style="font-variation-settings:'FILL' 1">${getWeatherIcon(day.conditions)}</span>
          <div class="text-xl font-bold">${Math.round(day.tempmax)}°</div>
          <div class="text-slate-500 text-sm">${Math.round(day.tempmin)}°</div>
        </div>
      `).join('');

    } catch (e) {
      console.error(e);
    } finally {
      document.getElementById('loadingIndicator').classList.add('hidden');
    }
  }

  // Events
  document.getElementById('citySearchInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') fetchWeather(e.target.value);
  });
  
  // Update Clock
  setInterval(() => {
    document.getElementById('currentDateTime').textContent = new Date().toLocaleString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true, weekday: 'long', month: 'short', day: 'numeric' });
  }, 1000);
</script>
</body>
</html>
